name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Syntax check
        run: |
          for f in lib/*.js tools/*.mjs test/*.mjs; do node --check "$f"; done

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack tarball for the market
        run: |
          npm pack
          # version-free asset name, so releases/latest/download/ never rots
          mv dsh-py-runner-*.tgz dsh-py-runner.tgz

      - uses: softprops/action-gh-release@v2
        with:
          files: dsh-py-runner.tgz
